version: '3.8'

services:
  # 1. Express API Backend Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: intervue-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-super_secret_intervue_jwt_key_2026}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - intervue-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 2. Frontend React Vite Nginx Service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: intervue-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - intervue-network

networks:
  intervue-network:
    driver: bridge
